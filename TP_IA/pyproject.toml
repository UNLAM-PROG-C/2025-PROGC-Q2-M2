[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecode-sliding-windows"
version = "0.1.0"
description = "Concurrent sliding-window line detection pipeline"
authors = [{name = "VibeCode"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "psutil>=5.9",
    "matplotlib>=3.5",
    "pytest>=7.0"
]

[project.optional-dependencies]
lsd = ["opencv-contrib-python>=4.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
